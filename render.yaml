services:
  # ─────────────────────────────────────────────────────────
  # Backend Web Service (Node.js + Express + Prisma)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: smartgrade-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartgrade-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # You will paste your Groq API key in the Render dashboard
      - key: NODE_ENV
        value: production

  # ─────────────────────────────────────────────────────────
  # Frontend Static Site (React + Vite SPA)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: smartgrade-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartgrade-backend
          property: host

# ─────────────────────────────────────────────────────────
# PostgreSQL Database
# ─────────────────────────────────────────────────────────
databases:
  - name: smartgrade-db
    databaseName: smartgrade
    user: smartgrade_admin
    plan: free
